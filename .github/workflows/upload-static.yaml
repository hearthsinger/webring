name: Upload static content
on:
  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      matched-files: ${{ steps.diff-files.outputs.matched-files }}
      force: ${{ steps.check-commit.outputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check files
        id: diff-files
        run: echo "matched-files=$(git lg HEAD^1..HEAD --raw --no-decorate --name-only --pretty=oneline | tail -n +2 | set -n -r '/static|(.*\.css)|(.*\.html)|src|assets' | wc -l)" >> $GITHUB_OUTPUT

      - name: Check commit
        id: check-commit
        run: |
          MESSAGE=$(git log -1 --format=%s)
          SCOPE=$(echo "${MESSAGE}" |sed -n 's/^[^ (]*(\([^)]*\)).*/\1/p')
          echo "## Preflight"
          echo "Detected scope: **\`${SCOPE:-none}\`**" >> $GITHUB_STEP_SUMMARY

          if [ ${SCOPE} = 'force-neocities' ]; then
            echo "force=true" >> $GITHUB_OUTPUT
          else
            echo "force=false" >> $GITHUB_OUTPUT
          fi

  build:
    environment:
      name: neocities
    needs: check-changes
    runs-on: ubuntu-latest
    if: ${{ needs.check-changes.outputs.matched-files != '0' || needs.check-changes.outputs.force == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Update find+replace targets
        run: |
          SHORT_HASH=$(git rev-parse --short=8 HEAD)
          find . -type f -name "*.html" -exec sh -c "sed -i s/BUILD_INFO/${SHORT_HASH}/g {}" \;

      - name: Upload to neocities
        env:
          NEOCITIES_USER: rings-dot-garden
          NEOCITIES_PASS: ${{ secrets.NEOCITIES_PASS }}
        run: |
          files=()
          clean=()

          echo "# Neocities Batch Upload" >> $GITHUB_STEP_SUMMARY
          echo "Searching for files" >> $GITHUB_STEP_SUMMARY
          echo "## Discovered Files" >> $GITHUB_STEP_SUMMARY

          while IFS= read -r file; do
            remote_path="${file#./}"
            files+=("-F" "${remote_path}=@${file}")
            clean+=("${remote_path}")
          done < <({ find static/ -type f; })

          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${clean[@]}" | tr ' ' '\n' | pr -4 -t -w 120 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "## Upload Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          curl -sS -H "Authorization: Bearer ${NEOCITIES_PASS}" ${files[@]} "https://neocities.org/api/upload" | tail -n 4 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

